# OmniHarness Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend Gateway API + agent runtime (port 8001)
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: omni-harness-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=omni-harness
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/archimedes-run/omni-harness-sandbox:latest}
      # Host paths for K8s HostPath volumes (must be absolute paths accessible by K8s node)
      # On Docker Desktop/OrbStack, use your actual host paths like /Users/username/...
      # Set these in your shell before running docker-compose:
      #   export OMNI_HARNESS_ROOT=/absolute/path/to/omni-harness
      - SKILLS_HOST_PATH=${OMNI_HARNESS_ROOT}/skills
      - THREADS_HOST_PATH=${OMNI_HARNESS_ROOT}/backend/.omni-harness/threads
      # Production: use PVC instead of hostPath to avoid data loss on node failure.
      # When set, hostPath vars above are ignored for the corresponding volume.
      # USERDATA_PVC_NAME uses subPath (threads/{thread_id}/user-data) automatically.
      # - SKILLS_PVC_NAME=omni-harness-skills-pvc
      # - USERDATA_PVC_NAME=omni-harness-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      # Override K8S API server URL since kubeconfig uses 127.0.0.1
      # which is unreachable from inside the container
      - K8S_API_SERVER=https://host.docker.internal:26443
    # NO env_file: the provisioner reads only the K8S_* settings above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - omni-harness-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway and (optionally) provisioner.
  nginx:
    image: nginx:alpine
    container_name: omni-harness-nginx
    ports:
      # Loopback only: the app must not be reachable from the LAN.
      - "127.0.0.1:2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      # Access/error logs on the host: they survive container recreation.
      - ../logs/nginx:/var/log/nginx
      # Daily rotation, 30 days kept, gzip (USR1 reopen: no lines lost).
      - ./nginx/rotate-logs.sh:/etc/nginx/rotate-logs.sh:ro
      # The console captures the other containers append to, size-capped here.
      - ../logs:/var/log/omni
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        CAP_FILES='/var/log/omni/gateway.console.log /var/log/omni/frontend.log' sh /etc/nginx/rotate-logs.sh loop /var/log/nginx /tmp/nginx.pid &
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      omni-harness-dev:
        # Fixed, so the gateway can trust X-Forwarded-For from THIS peer only
        # (GATEWAY_TRUSTED_PROXIES below).
        ipv4_address: 192.168.200.10
    restart: unless-stopped

  # Frontend - Next.js Development Server
  # ── Session Watcher (Feature 001) ──────────────────────────────────────────
  # Read-only MCP server over SSE. It reports what coding sessions are doing.
  #
  # WHY IT IS A SERVICE NOW. It was a process nobody started: no compose entry,
  # no make target, no supervisor. The symptom was not an error — the gateway
  # skips an MCP server it cannot reach, so the agent simply had no
  # session-watcher tools and answered "share a URL and a token with me", which
  # reads as the feature not existing.
  #
  # THE PORT IS PUBLISHED ON PURPOSE. extensions_config.json points at
  # host.docker.internal:18101, and publishing lets that ONE url work from both
  # the gateway container (via extra_hosts) and a gateway run locally outside
  # Docker. A service-name url would have worked only inside compose and would
  # have silently broken `make dev` run on the host.
  session-watcher:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: omni-harness-session-watcher
    # NO HOST backend/ MOUNT, and no uv sync. The image already contains the
    # code. Mounting ../backend here and syncing inside the container WIPED the
    # developer's host .venv — the gateway service guards against exactly this
    # with a named `gateway-venv` volume, and this service had no such guard
    # because it did not need the mount in the first place.
    command: sh -c "cd /app/backend && PYTHONPATH=. uv run --no-sync python -m session_watcher.server --port 18101 --root /root/.claude/projects --codex-root /root/.codex/sessions"
    ports:
      # Loopback only; containers still reach it via host.docker.internal.
      - "127.0.0.1:18101:18101"
    volumes:
      # The watcher token (REQUIRED; scripts/ensure-watcher-token.sh creates it), read-only.
      - ${OMNI_HARNESS_SECRETS_DIR:-${HOME:?HOME must be set}/.omni-harness-secrets}/watcher.token:/run/secrets/watcher.token:ro
      # The sessions it reports on. READ-ONLY: this server never writes, and
      # the mount is what makes that structural rather than a promise.
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      # Codex sessions (Feature 005), READ-ONLY for the same reason. Honours
      # CODEX_HOME like Codex does. On a machine that has never run Codex the
      # folder is created empty, which reads as "no Codex sessions"; a folder
      # that exists but cannot be read is reported as "can't read".
      - type: bind
        source: ${CODEX_HOME:-${HOME:?HOME must be set}/.codex}
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    environment:
      - OMNI_HARNESS_WATCHER_TOKEN_FILE=/run/secrets/watcher.token
    working_dir: /app
    networks:
      - omni-harness-dev
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: omni-harness-frontend
    command: sh -c "cd frontend && pnpm run dev >> /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - OMNI_HARNESS_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - OMNI_HARNESS_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:2026
    env_file:
      - ../frontend/.env
    networks:
      - omni-harness-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: omni-harness-gateway
    command: sh -c "{ cd backend && (uv sync || (echo '[startup] uv sync failed; recreating .venv and retrying once' && uv venv --allow-existing .venv && uv sync)) && mkdir -p .omni-harness && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml' --reload-include='.env' --reload-exclude=/app/backend/.omni-harness; } >> /app/logs/gateway.console.log 2>&1"
    volumes:
      # The watcher token (REQUIRED; scripts/ensure-watcher-token.sh creates it), read-only.
      - ${OMNI_HARNESS_SECRETS_DIR:-${HOME:?HOME must be set}/.omni-harness-secrets}/watcher.token:/run/secrets/watcher.token:ro
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      # extensions_config.json is written from INSIDE this container at runtime
      # (skills toggles, local/agent-built MCP servers). Mount its PARENT
      # DIRECTORY, not the single file: atomic writes use os.replace (a new
      # inode), which detaches a single-file bind mount and tears partial syncs
      # on Docker Desktop/macOS. OMNI_HARNESS_EXTENSIONS_CONFIG_PATH points the
      # gateway at the file inside this directory mount.
      - ../extensions:/app/extensions
      - ../skills:/app/skills
      - ../logs:/app/logs
      # Use a Docker-managed uv cache volume instead of a host bind mount.
      # On macOS/Docker Desktop, uv may fail to create symlinks inside shared
      # host directories, which causes startup-time `uv sync` to crash.
      - gateway-uv-cache:/root/.cache/uv
      # DooD: AioSandboxProvider runs inside the Gateway process.
      - /var/run/docker.sock:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + Codex CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
      # Run history keys (Feature 006): the master key and the key store of
      # per-run data keys, in their OWN subdirectory of the secrets dir (never
      # beside watcher.token), mounted into the gateway ONLY, read-write
      # (delete-all rotates the master key). `make run-store-keys` makes the
      # 0700 host dir; the gateway creates the files on first run. Never back
      # this directory up together with OMNI_HARNESS_HOME.
      - type: bind
        source: ${OMNI_HARNESS_SECRETS_DIR:-${HOME:?HOME must be set}/.omni-harness-secrets}/run-store
        target: /run/secrets/run-store
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - OMNI_HARNESS_WATCHER_TOKEN_FILE=/run/secrets/watcher.token
      - OMNI_HARNESS_RUN_STORE_KEY_FILE=/run/secrets/run-store/run_store.key
      - CI=true
      - OMNI_HARNESS_PROJECT_ROOT=/app
      # Point the gateway at the extensions config inside the DIRECTORY mount
      # (see volumes above) so runtime writes are atomic and never truncated.
      - OMNI_HARNESS_EXTENSIONS_CONFIG_PATH=/app/extensions/extensions_config.json
      - OMNI_HARNESS_HOME=/app/backend/.omni-harness
      - OMNI_HARNESS_CHANNELS_LANGGRAPH_URL=${OMNI_HARNESS_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - OMNI_HARNESS_CHANNELS_GATEWAY_URL=${OMNI_HARNESS_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - OMNI_HARNESS_HOST_BASE_DIR=${OMNI_HARNESS_ROOT}/backend/.omni-harness
      - OMNI_HARNESS_HOST_SKILLS_PATH=${OMNI_HARNESS_ROOT}/skills
      # Sandboxes publish NO host port: they join this private network,
      # shared only with the gateway, and are reached by container name.
      - OMNI_HARNESS_SANDBOX_NETWORK=omni-harness-dev-sandboxes
      # Logs: daily append-only files, 30 days kept (app/gateway/log_files.py).
      # The shell redirect above only APPENDS what precedes logging setup.
      - GATEWAY_LOG_FILE=/app/logs/gateway.log
      # Real client IP: forwarded headers are trusted from nginx's fixed address only.
      - GATEWAY_TRUSTED_PROXIES=192.168.200.10
      # Allowlisted keys from .env (secret_usage.GATEWAY_ENV_KEYS); NO env_file.
      # Bare names: passed only when set (compose --env-file ../.env), never as "".
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_BILLING_HEADER
      - AUTH_JWT_SECRET
      - AUTH_TRUSTED_PROXIES
      - CLAUDE_CODE_CREDENTIALS_PATH
      - CLAUDE_CODE_OAUTH_TOKEN
      - COMPOSIO_API_KEY
      - COMPOSIO_CONNECTED_ACCOUNT_ID
      - COMPOSIO_IMPORTANT_ONLY
      - COMPOSIO_TOOLKIT
      - COMPOSIO_USER_ID
      - DEEPSEEK_API_KEY
      - DISCORD_BOT_TOKEN
      - EXA_API_KEY
      - FIRECRAWL_API_KEY
      - GATEWAY_ALLOWED_HOSTS
      - GATEWAY_ENABLE_DOCS
      - GEMINI_API_KEY
      - GITHUB_TOKEN
      - GOOGLE_API_KEY
      - INFOQUEST_API_KEY
      - JINA_API_KEY
      - LANGSMITH_API_KEY
      - LANGSMITH_ENDPOINT
      - LANGSMITH_PROJECT
      - LANGSMITH_TRACING
      - MOONSHOT_API_KEY
      - OMNI_HARNESS_INTERNAL_AUTH_TOKEN
      - OPENAI_API_KEY
      - OPENCLAW_BEARER_TOKEN
      - OPENROUTER_API_KEY
      - SERPER_API_KEY
      - SLACK_APP_TOKEN
      - SLACK_BOT_TOKEN
      - TAVILY_API_KEY
      - TELEGRAM_BOT_TOKEN
      - TZ
      - VOLCENGINE_API_KEY
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - omni-harness-dev
      - omni-harness-dev-sandboxes
    restart: unless-stopped

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  gateway-uv-cache:

networks:
  omni-harness-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  # Gateway <-> sandbox containers only. A fixed name, because the gateway
  # starts sandboxes through the host's Docker daemon and names this network.
  omni-harness-dev-sandboxes:
    name: omni-harness-dev-sandboxes
    driver: bridge
    # No route out of it at all: sandboxes reach the gateway and nothing else
    # (Docker Desktop routes host.docker.internal only through a non-internal network).
    internal: true
