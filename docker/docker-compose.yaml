# OmniHarness Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   OMNI_HARNESS_PROJECT_ROOT           — project root for relative runtime paths
#   OMNI_HARNESS_HOME                   — runtime data dir, default .omni-harness under $OMNI_HARNESS_PROJECT_ROOT (or cwd)
#   OMNI_HARNESS_CONFIG_PATH            — path to config.yaml
#   OMNI_HARNESS_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   OMNI_HARNESS_SKILLS_PATH            — skills dir, default $OMNI_HARNESS_PROJECT_ROOT/skills
#   OMNI_HARNESS_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   OMNI_HARNESS_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: omni-harness-nginx
    ports:
      # Loopback by default; set BIND_ADDR to publish on another interface.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      # Access/error logs on the host: they survive container recreation.
      - ${OMNI_HARNESS_LOG_DIR:-../logs}/nginx:/var/log/nginx
      # Daily rotation, 30 days kept, gzip (USR1 reopen: no lines lost).
      - ./nginx/rotate-logs.sh:/etc/nginx/rotate-logs.sh:ro
      # The console captures the other containers append to, size-capped here.
      - ${OMNI_HARNESS_LOG_DIR:-../logs}:/var/log/omni
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && (CAP_FILES='/var/log/omni/gateway.console.log /var/log/omni/frontend.log' sh /etc/nginx/rotate-logs.sh loop /var/log/nginx /tmp/nginx.pid &)
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      omni-harness:
        # Fixed, so the gateway can trust X-Forwarded-For from THIS peer only
        # (GATEWAY_TRUSTED_PROXIES on the gateway).
        ipv4_address: ${OMNI_HARNESS_NGINX_IP:-172.30.226.10}
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  # ── Session Watcher (Feature 001) ──────────────────────────────────────────
  # Read-only MCP server over SSE. See docker-compose-dev.yaml for why this is a
  # service rather than something you remember to start: it was a process nobody
  # launched, and the gateway skips an unreachable MCP server silently, so the
  # only symptom was the agent behaving as though the feature did not exist.
  #
  # The port is published so the single host.docker.internal:18101 url in
  # extensions_config.json works from inside the stack and from a gateway run
  # outside it.
  session-watcher:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: omni-harness-session-watcher
    command: sh -c "cd /app/backend && PYTHONPATH=. uv run --no-sync python -m session_watcher.server --port 18101 --root /root/.claude/projects --codex-root /root/.codex/sessions"
    ports:
      # Loopback only; containers still reach it via host.docker.internal.
      - "127.0.0.1:18101:18101"
    volumes:
      # READ-ONLY by mount, not by convention.
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      # Codex sessions (Feature 005), read-only. See docker-compose-dev.yaml.
      - type: bind
        source: ${CODEX_HOME:-${HOME:?HOME must be set}/.codex}
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    networks:
      - omni-harness
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: omni-harness-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - OMNI_HARNESS_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - omni-harness
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: omni-harness-gateway
    # Shared across workers: each worker mints its own token otherwise, and
    # internal loopback calls (channels, trigger injection) 401 whenever the
    # kernel hands the connection to a different worker than minted it.
    command: sh -c "export OMNI_HARNESS_INTERNAL_AUTH_TOKEN=${OMNI_HARNESS_INTERNAL_AUTH_TOKEN:-$$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')} && cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-4}"
    volumes:
      - ${OMNI_HARNESS_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${OMNI_HARNESS_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${OMNI_HARNESS_HOME}:/app/backend/.omni-harness
      # DooD: AioSandboxProvider starts sandbox containers via host Docker daemon
      - ${OMNI_HARNESS_DOCKER_SOCKET}:/var/run/docker.sock
      # Logs survive container recreation (daily files, 30 days kept).
      - ${OMNI_HARNESS_LOG_DIR:-../logs}:/app/logs
      # CLI auth directories for auto-auth (Claude Code + Codex CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - OMNI_HARNESS_PROJECT_ROOT=/app
      - OMNI_HARNESS_HOME=/app/backend/.omni-harness
      - OMNI_HARNESS_CONFIG_PATH=/app/backend/config.yaml
      - OMNI_HARNESS_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - OMNI_HARNESS_CHANNELS_LANGGRAPH_URL=${OMNI_HARNESS_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - OMNI_HARNESS_CHANNELS_GATEWAY_URL=${OMNI_HARNESS_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      # DooD path/network translation
      - OMNI_HARNESS_HOST_BASE_DIR=${OMNI_HARNESS_HOME}
      - OMNI_HARNESS_HOST_SKILLS_PATH=${OMNI_HARNESS_REPO_ROOT}/skills
      - OMNI_HARNESS_SANDBOX_HOST=host.docker.internal
      # Logs: daily append-only files, 30 days kept (app/gateway/log_files.py).
      - GATEWAY_LOG_FILE=/app/logs/gateway.log
      # Real client IP: forwarded headers are trusted from nginx's fixed address only.
      - GATEWAY_TRUSTED_PROXIES=${OMNI_HARNESS_NGINX_IP:-172.30.226.10}
      # So the gateway can WARN at startup when nginx is published off loopback.
      - BIND_ADDR=${BIND_ADDR:-127.0.0.1}
      # Allowlisted keys from .env (secret_usage.GATEWAY_ENV_KEYS); NO env_file.
      # Bare names: passed only when set (compose --env-file ../.env), never as "".
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_BILLING_HEADER
      - AUTH_JWT_SECRET
      - AUTH_TRUSTED_PROXIES
      - CLAUDE_CODE_CREDENTIALS_PATH
      - CLAUDE_CODE_OAUTH_TOKEN
      - COMPOSIO_API_KEY
      - COMPOSIO_CONNECTED_ACCOUNT_ID
      - COMPOSIO_IMPORTANT_ONLY
      - COMPOSIO_TOOLKIT
      - COMPOSIO_USER_ID
      - DEEPSEEK_API_KEY
      - DISCORD_BOT_TOKEN
      - EXA_API_KEY
      - FIRECRAWL_API_KEY
      - GATEWAY_ENABLE_DOCS
      - GEMINI_API_KEY
      - GITHUB_TOKEN
      - GOOGLE_API_KEY
      - INFOQUEST_API_KEY
      - JINA_API_KEY
      - LANGSMITH_API_KEY
      - LANGSMITH_ENDPOINT
      - LANGSMITH_PROJECT
      - LANGSMITH_TRACING
      - MOONSHOT_API_KEY
      - OMNI_HARNESS_INTERNAL_AUTH_TOKEN
      - OPENAI_API_KEY
      - OPENCLAW_BEARER_TOKEN
      - OPENROUTER_API_KEY
      - SERPER_API_KEY
      - SLACK_APP_TOKEN
      - SLACK_BOT_TOKEN
      - TAVILY_API_KEY
      - TELEGRAM_BOT_TOKEN
      - TZ
      - VOLCENGINE_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The MCP builder's vault key (#59), for the gateway only (see docker-compose-dev.yaml).
    secrets:
      - mcp_vault_key
    networks:
      - omni-harness
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: omni-harness-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=omni-harness
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/archimedes-run/omni-harness-sandbox:latest}
      - SKILLS_HOST_PATH=${OMNI_HARNESS_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${OMNI_HARNESS_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    # NO env_file: the provisioner reads only the K8S_* settings above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - omni-harness
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  omni-harness:
    driver: bridge
    ipam:
      config:
        # Fixed so nginx can have a fixed address (the only trusted proxy).
        - subnet: ${OMNI_HARNESS_SUBNET:-172.30.226.0/24}

secrets:
  mcp_vault_key:
    file: ${OMNI_HARNESS_MCP_VAULT_KEY_FILE:-${HOME:?HOME must be set}/.omni-harness-secrets/mcp_vault.key}
