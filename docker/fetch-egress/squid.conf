# Fetch egress (docker/fetch-egress): the gateway's web_fetch goes out through
# here and nowhere else. Public internet only: plain http to port 80, CONNECT
# to port 443, GET/HEAD; every destination is checked by the address Squid
# itself resolves and connects to (dst), on every request, so each redirect
# hop the gateway re-requests is checked again. Squid never follows redirects.
# A separate proxy from docker/sandbox-egress, whose rules this does not touch.
# tests/security/test_fetch_egress.py keeps these lines.
http_port 3128

# Clients: the networks this container sits on (entrypoint.sh writes the file).
acl clients src "/run/fetch/clients.acl"
acl CONNECT method CONNECT
acl tls_port port 443
acl http_port port 80
acl fetch_methods method GET HEAD
# Never-public destinations, by resolved address (IPv4 and IPv6).
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 ::/128 ::1 64:ff9b::/96 100::/64 2001::/23 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 fec0::/10 ff00::/8
# The compose networks this container is attached to, whatever their range.
acl attached_nets dst "/run/fetch/attached.acl"
# Internal names, refused before any lookup: localhost, internal suffixes,
# and single-label names (Docker service names such as gateway).
acl internal_names dstdomain -n .localhost .local .internal .lan .home.arpa .localdomain .docker .intranet .corp
acl single_label dstdom_regex -n ^[^.:]+$

http_access deny !clients
http_access deny manager
http_access deny CONNECT !tls_port
http_access deny !CONNECT !http_port
http_access deny !CONNECT !fetch_methods
http_access deny internal_names
http_access deny single_label
http_access deny to_localhost
http_access deny private_dst
http_access deny attached_nets
http_access allow clients
http_access deny all

# The resolver is the local dnsmasq (stop-dns-rebind: private answers dropped);
# no hosts file, no search domains.
dns_nameservers 127.0.0.1
hosts_file none
dns_defnames off

reply_body_max_size 2 MB
connect_timeout 10 seconds
read_timeout 20 seconds
client_lifetime 1 minute
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on
cache_effective_user squid
pid_filename /run/fetch/squid.pid
access_log stdio:/run/fetch/access.log
cache_log /run/fetch/cache.log
logfile_rotate 0
