<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: the OmniHarness mark (a ring with a node on its orbit), light
       on dark so it reads on any tab. -->
  <defs>
    <mask id="icon-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="44" cy="20" r="10" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fafafa" stroke-width="6" mask="url(#icon-cut)"/>
  <circle cx="44" cy="20" r="6.5" fill="#fafafa"/>
</svg>
