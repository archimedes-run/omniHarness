<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- OmniHarness mark: a ring with a node on it, like a satellite on its
       orbit. Used as a CSS mask, so only the shapes' alpha matters. -->
  <defs>
    <mask id="mark-cut">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="72" cy="28" r="17" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#000" stroke-width="11" mask="url(#mark-cut)"/>
  <circle cx="72" cy="28" r="11" fill="#000"/>
</svg>
