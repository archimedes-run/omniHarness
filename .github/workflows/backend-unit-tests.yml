name: Unit Tests

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      # config.yaml is gitignored (it holds local model and provider settings),
      # but ~40 tests load it. Without this they fail in CI for an environment
      # reason and have done since the file was first ignored — noise that made
      # a red build uninformative.
      - name: Provide a config for tests
        run: cp config.example.yaml config.yaml

      - name: Run unit tests of backend
        working-directory: backend
        run: make test
