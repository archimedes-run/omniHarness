# The single PR workflow. One required check gates merging: "CI passed"
# (job id `ci-ok`), which fails if any job below failed or was cancelled and
# passes when every job succeeded or was skipped.
#
# On a pull request, the `changes` job decides which areas the PR touches
# (scripts/ci/changed_areas.sh documents the rules) and the area jobs skip
# what the PR cannot affect. Anything the rules do not classify, and any
# change to CI itself, runs everything. On push to main, on the nightly
# schedule and on manual dispatch, everything runs regardless of paths.
#
# This file replaces lint-check.yml, backend-unit-tests.yml,
# frontend-unit-tests.yml, e2e-tests.yml, browser-capability.yml and
# theme-rendering.yml. The job steps are theirs, unchanged, plus caches.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Nightly full run, every job regardless of paths.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to the same PR supersedes the older run. Runs on main (push,
  # nightly, dispatch) each finish, so every main commit gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Which areas changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # HEAD is the PR merge commit; the three-dot diff is what the PR adds.
            git diff --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"
            echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
            scripts/ci/changed_areas.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'backend=true\nfrontend=true\nreason=%s runs everything\n' "$EVENT" | tee -a "$GITHUB_OUTPUT"
          fi

  docs-lint:
    name: docs-lint
    # Always runs: it is the only job a docs/specs-only PR needs, and it is
    # seconds long. Stdlib Python, no downloads.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Markdown links and conflict markers
        run: python3 scripts/ci/check_docs.py

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: |
          cd frontend
          pnpm format

      - name: Run frontend linting
        run: |
          cd frontend
          pnpm lint

      - name: Check TypeScript types
        run: |
          cd frontend
          pnpm typecheck

      - name: Build frontend
        run: |
          cd frontend
          BETTER_AUTH_SECRET=local-dev-secret pnpm build

  backend-unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Pinned: tests/security/test_logs_and_binds.py's nginx log rotation fails
    # on ubuntu-latest (26.04); move with the Playwright jobs.
    runs-on: ubuntu-24.04
    # The suite runs on all runner cores (pytest-xdist, `make test`), well
    # under this; the margin is for a slow runner, not for the suite growing.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run unit tests of backend
        working-directory: backend
        # No config.yaml and no key, as on a fresh clone: tests/conftest.py
        # points the suite at config.example.yaml (Article XIV).
        run: make test

  frontend-unit-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests of frontend
        working-directory: frontend
        run: make test

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(sed -nE 's/^  playwright@([0-9][^:]*):$/\1/p' frontend/pnpm-lock.yaml | head -n 1)
          test -n "$version" || { echo "::error::no playwright version in frontend/pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}

      # Unchanged on a cache hit: the install skips a browser already present
      # and still installs the system libraries (--with-deps) the cache cannot hold.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm exec playwright test
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Measures whether CI can run RENDERING assertions.
  #
  # Kept apart from e2e-tests by design. The e2e suite was red for months
  # because it starts no backend, so a browser result buried there would prove
  # nothing.
  #
  # This job installs Chromium and asserts on computed styles and layout. Its
  # outcome decides whether frontend/docs/FRONTEND_TESTING_GAP.md describes a
  # local inconvenience or a real testing hole — and therefore what shape Feature
  # 004's UI acceptance criteria can take.
  probe:
    name: Can CI run rendering assertions?
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(sed -nE 's/^  playwright@([0-9][^:]*):$/\1/p' frontend/pnpm-lock.yaml | head -n 1)
          test -n "$version" || { echo "::error::no playwright version in frontend/pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}

      # The step that fails locally. Reported separately so "the bundle cannot
      # be downloaded" and "the browser cannot run" stay distinguishable — they
      # are different findings with different fixes. On a cache hit the
      # download is skipped; --with-deps still installs the system libraries.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Report the installed bundle size
        run: |
          echo "Locally this directory stays at ~448 KB against ~350 MB expected."
          du -sh ~/.cache/ms-playwright/* 2>/dev/null || echo "no bundle present"

      - name: Run the rendering assertions
        working-directory: frontend
        # A dedicated config with NO webServer. playwright.config.ts starts
        # Next.js, and a failure to build the app would answer a different
        # question while looking like an answer to this one.
        run: npx playwright test --config=playwright.probe.config.ts

  # Rendering assertions that defend the theme, against a real build.
  #
  # Kept apart from e2e-tests for the same reason as the probe. These specs hit
  # `/` only, which is static, so no backend is needed here.
  theme:
    name: Does the theme change what the user sees?
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(sed -nE 's/^  playwright@([0-9][^:]*):$/\1/p' frontend/pnpm-lock.yaml | head -n 1)
          test -n "$version" || { echo "::error::no playwright version in frontend/pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}

      # On a cache hit the download is skipped; --with-deps still installs the
      # system libraries.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # The build is reported as its own step so "the app does not compile" and
      # "the theme does not change the render" stay distinguishable. They are
      # different findings with different fixes, and a build failure inside the
      # test step would wear this job's name while answering another question.
      - name: Build the app
        working-directory: frontend
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build

      - name: Run the rendering assertions
        working-directory: frontend
        run: npx playwright test --config=playwright.theme.config.ts

  ci-ok:
    name: CI passed
    if: always()
    needs:
      - changes
      - docs-lint
      - lint
      - lint-frontend
      - backend-unit-tests
      - frontend-unit-tests
      - e2e-tests
      - probe
      - theme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "All jobs succeeded or were skipped by the path rules."
