<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New chat, v2 capsule and chat bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#8FA8FF}a:hover{color:#B7C6FF}
button{font-family:inherit}
.cap button:hover{background:#24272D;color:#ECEDEF}
.chip .x:hover{background:#3A3E46;color:#ECEDEF}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1120px; background: #121316; color: #ECEDEF; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <nav aria-label="Main" style="flex: 1 1 248px; max-width: 248px; min-width: 220px; box-sizing: border-box; background: #17181C; border-right: 1px solid #2E3138; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8FA8FF" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="19" cy="6" r="2.5" fill="#8FA8FF"></circle></svg>
      <span style="font-weight: 600; font-size: 15px">OmniHarness</span>
    </div>
    <a href="#" aria-current="page" style="padding: 9px 10px; border-radius: 8px; background: #24272D; color: #ECEDEF; text-decoration: none; font-weight: 500">New chat</a>
    <a href="#" style="padding: 9px 10px; border-radius: 8px; color: #C9CCD2; text-decoration: none">Chats</a>
    <a href="Connections.dc.html" style="padding: 9px 10px; border-radius: 8px; color: #C9CCD2; text-decoration: none">MCP Suite</a>
    <div style="height: 1px; background: #2E3138; margin: 14px 4px"></div>
    <div style="font-size: 12px; color: #9EA3AD; padding: 0 10px 6px">Recent</div>
    <a href="#" style="padding: 7px 10px; color: #C9CCD2; text-decoration: none">Calendar cleanup</a>
    <a href="#" style="padding: 7px 10px; color: #C9CCD2; text-decoration: none">Feature 005 slice review</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">

    <!-- Top bar: 3-column grid so the capsule sits on the true centre of the main area, whatever is left or right of it -->
    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 64px; padding: 0 24px; box-sizing: border-box">
      <span style="color: #9EA3AD; font-size: 13px">New chat</span>
      <div class="cap" role="toolbar" aria-label="Workspace panels" style="display: flex; align-items: center; gap: 4px; height: 44px; box-sizing: border-box; background: #1C1E23; border: 1px solid #2E3138; border-radius: 22px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.35)">
        <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 17px; border: none; background: #2F3A5C; color: #ECEDEF; font-size: 14px; font-weight: 500; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14c2.3 0 4 1.5 4.5 4"></path></svg>Agents</button>
        <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 17px; border: none; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Skills</button>
        <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 17px; border: none; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9z"></path></svg>Automations</button>
        <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 17px; border: none; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>Tasks</button>
      </div>
      <div style="display: flex; justify-content: flex-end">
        <button type="button" aria-label="Search everything (Command K)" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid #2E3138; background: #17181C; color: #9EA3AD; font-size: 13px; cursor: pointer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>Search
          <kbd style="font-family: inherit; font-size: 12px; background: #24272D; border: 1px solid #3A3E46; border-radius: 6px; padding: 1px 6px; color: #C9CCD2">⌘K</kbd></button>
      </div>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 32px 80px">
      <div style="width: 100%; max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
        <h1 style="margin: 0; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">What are we working on, Rishabh?</h1>

        <!-- Chat bar -->
        <div style="background: #1C1E23; border: 1px solid #3A3E46; border-radius: 20px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3)">

          <div role="list" aria-label="Context for this chat" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <!-- Project chip -->
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 10px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2B65A" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              <span>OmniHarness</span>
              <button type="button" class="x" aria-label="Remove project OmniHarness" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <!-- Agent chip -->
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 5px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; background: #3D4A78; color: #ECEDEF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">L</span>
              <span>Lead agent</span>
              <button type="button" class="x" aria-label="Remove Lead agent" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 5px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; background: #2E5C4A; color: #ECEDEF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">R</span>
              <span>Researcher</span>
              <button type="button" class="x" aria-label="Remove Researcher" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <!-- Integration chips -->
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 6px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <span role="img" aria-label="Google Calendar logo" style="width: 22px; height: 22px; border-radius: 6px; background: #3B6FD8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">31</span>
              <span>Google Calendar</span>
              <button type="button" class="x" aria-label="Remove Google Calendar from this chat" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 6px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <span role="img" aria-label="GitHub logo" style="width: 22px; height: 22px; border-radius: 6px; background: #ECEDEF; color: #121316; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">GH</span>
              <span>GitHub</span>
              <button type="button" class="x" aria-label="Remove GitHub from this chat" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 6px; border-radius: 17px; background: #24272D; border: 1px dashed #F2B65A; font-size: 14px">
              <span role="img" aria-label="Filesystem" style="width: 22px; height: 22px; border-radius: 6px; background: #17181C; color: #C9CCD2; display: inline-flex; align-items: center; justify-content: center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
              <span>Filesystem</span><span style="color: #F2B65A; font-size: 12px">Unreachable</span>
              <button type="button" class="x" aria-label="Remove Filesystem from this chat" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <!-- Skill chips -->
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 10px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FA8FF" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
              <span>Deep research</span>
              <button type="button" class="x" aria-label="Remove skill Deep research" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <span class="chip" role="listitem" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 4px 0 10px; border-radius: 17px; background: #24272D; border: 1px solid #3A3E46; font-size: 14px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FA8FF" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
              <span>Spec Kit</span>
              <button type="button" class="x" aria-label="Remove skill Spec Kit" style="width: 26px; height: 26px; border-radius: 13px; border: none; background: none; color: #9EA3AD; font-size: 16px; line-height: 1; cursor: pointer">×</button></span>
            <!-- Overflow -->
            <button type="button" aria-expanded="false" aria-label="Show 21 more skills" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #3A3E46; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">+21 skills</button>
            <button type="button" aria-label="Add context" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px; border-radius: 17px; border: 1px dashed #4A4E57; background: none; color: #ECEDEF; font-size: 14px; cursor: pointer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
          </div>

          <label style="display: block">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span>
            <textarea rows="2" placeholder="Ask anything · @ to bring in an agent · / for commands" style="width: 100%; box-sizing: border-box; background: transparent; border: none; resize: none; color: #ECEDEF; font: inherit; font-size: 16px; line-height: 1.5; outline: none; padding: 4px 2px"></textarea>
          </label>

          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <button type="button" aria-label="Attach file" style="width: 38px; height: 38px; border-radius: 10px; border: none; background: none; color: #C9CCD2; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg></button>
            <span style="flex: 1"></span>
            <button type="button" aria-label="Mode: Flash" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #2E3138; background: #24272D; color: #ECEDEF; font-size: 14px; cursor: pointer"><span style="color: #9EA3AD">Mode</span> Flash ▾</button>
            <button type="button" aria-label="Reasoning effort: Low" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #2E3138; background: #24272D; color: #ECEDEF; font-size: 14px; cursor: pointer"><span style="color: #9EA3AD">Effort</span> Low ▾</button>
            <button type="button" aria-label="Model: Claude Sonnet" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; border: 1px solid #2E3138; background: #24272D; color: #ECEDEF; font-size: 14px; cursor: pointer">
              <span role="img" aria-label="Anthropic logo" style="width: 20px; height: 20px; border-radius: 5px; background: #D97757; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">A</span>Claude Sonnet ▾</button>
            <button type="button" aria-label="Send" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #8FA8FF; color: #121316; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
          <button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2E3138; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">Plan my week</button>
          <button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2E3138; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">What's blocked?</button>
          <button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2E3138; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">Review a coding session</button>
          <button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2E3138; background: none; color: #C9CCD2; font-size: 14px; cursor: pointer">New automation</button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
