<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">OmniHarness</title>
  <!-- The OmniHarness mark: a ring (the harness) with an agent on its orbit.
       Self-contained tile, so it reads on light and dark backgrounds. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1E23"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="0.55" stop-color="#8FA8FF"/>
      <stop offset="1" stop-color="#C3B4FF"/>
    </linearGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#B6F0D2"/>
      <stop offset="1" stop-color="#5CC793"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FA8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FA8FF" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="160" height="160" fill="#fff"/>
      <circle cx="112" cy="48" r="24" fill="#000"/>
    </mask>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="35.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="80" cy="80" r="62" fill="url(#glow)"/>
  <!-- faint orbit -->
  <circle cx="80" cy="80" r="56" fill="none" stroke="#8FA8FF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="2 7"/>
  <!-- the harness -->
  <circle cx="80" cy="80" r="42" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round" mask="url(#cut)"/>
  <!-- the agent on its orbit -->
  <circle cx="112" cy="48" r="15" fill="url(#node)"/>
  <circle cx="107" cy="43" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
