[project]
name = "session-watcher"
version = "0.1.0"
description = "Read-only watcher for coding-agent sessions running on the host"
requires-python = ">=3.12"
# Constitution Article I: this package MUST NOT depend on omniharness-harness,
# langgraph, or any core package. It integrates over MCP, not by import.
# A dependency added here that violates that is a constitution violation,
# not merely a design smell.
dependencies = [
    "mcp>=1.2.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["session_watcher"]
