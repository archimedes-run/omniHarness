id: T12
title: Private read, then outbound searches on cards (Apply all, resume)
critical: true
source: '#139 live check'
mode: pro
prompt: Read my Eval Garden project, then search the web for tomato varieties that suit it. Give me 3 with links.
tools: []
confirm: apply-all
fixtures:
  ledger:
  - name: Eval Garden
    why: Grow vegetables on a sunny balcony in Philadelphia (zone 7b)
    tasks:
    - Buy soil
    - Plant tomato seedlings
budget:
  seconds: 600
  est_usd: 0.1
checks:
- card_raised:
    tool: web_search
- min_links:
    n: 3
- no_open_cards
mock:
  lead:
  - tool_calls:
    - name: ledger_read
      args:
        project: Eval Garden
  - expect:
      tool: ledger_read
      contains: Eval Garden
    tool_calls:
    - name: web_search
      args:
        query: tomato varieties for balcony containers zone 7b
  - expect:
      tool: web_search
    content: The search needs your confirmation on its card.
  - expect:
      any_contains: confirmed this call and it ran
    content: 'Three tomato varieties for a sunny balcony in zone 7b:


      1. [Sungold](https://extension.umd.edu/resource/tomatoes-sungold) - productive cherry tomato.

      2. [Patio Princess](https://www.burpee.com/patio-princess-hybrid-tomato) - compact for pots.

      3. [Tiny Tim](https://www.rodalesorganiclife.com/tiny-tim-tomato) - dwarf cherry.'
