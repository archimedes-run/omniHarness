id: M-TIME
title: Past the research time no lookup is made, and from 60% each result says to
  answer
mock_only: true
source: 'real-model eval 2026-11-13 (T02: 7 minutes on one question; T08: 10 minutes)'
mode: pro
prompt: Main new features of the latest stable React release; cite 3 sources.
tools: []
confirm: none
budget:
  seconds: 90
checks:
- tool_called:
    name: web_search
    min: 3
- min_links:
    n: 3
    distinct_hosts: 2
mock:
  lead:
  - tool_calls:
    - name: web_search
      args:
        query: react 19 features a
  - expect:
      tool: web_search
    sleep: 13
    tool_calls:
    - name: web_search
      args:
        query: react 19 features b
  - expect:
      tool: web_search
      contains: Write the answer now
    sleep: 9
    tool_calls:
    - name: web_search
      args:
        query: react 19 features c
  - expect:
      tool: web_search
      contains: research time
    content: React 19 adds Actions and use() [React v19](https://react.dev/blog/2024/12/05/react-19),
      see also [Versions](https://react.dev/versions) and [Telerik](https://www.telerik.com/blogs/whats-new-react-19).
config:
  research_budget:
    max_seconds: 20
