id: M-MIXED
title: An outbound card and a ledger card in one turn resume once
mock_only: true
source: spec 009 FR-058 (mocked)
mode: pro
prompt: Read Eval Garden, create a project 'Eval Mixed' and search the web for tomato varieties.
tools: []
confirm: confirm-all
fixtures:
  ledger:
  - name: Eval Garden
    why: Grow vegetables on a sunny balcony in Philadelphia (zone 7b)
    tasks:
    - Buy soil
    - Plant tomato seedlings
budget:
  seconds: 60
checks:
- card_raised:
    tool: ledger_apply
- card_raised:
    tool: web_search
- resume_count:
    exact: 1
- no_open_cards
mock:
  lead:
  - tool_calls:
    - name: ledger_read
      args:
        project: Eval Garden
  - expect:
      tool: ledger_read
    tool_calls:
    - name: ledger_apply
      args:
        changes:
        - op: create_project
          name: Eval Mixed
          why: test
    - name: web_search
      args:
        query: tomato varieties balcony
  - content: Both wait on their cards.
  - expect:
      any_contains: confirmed this call and it ran
    content: 'Eval Mixed exists, and Sungold suits the balcony: [Sungold](https://extension.umd.edu/resource/tomatoes-sungold).'
