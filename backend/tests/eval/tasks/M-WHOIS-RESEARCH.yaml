id: M-WHOIS-RESEARCH
title: The research tool's lookups count in the same per-turn budget as the lead's
mock_only: true
source: live chat 2026-11-14 (one budget for the lead, the research tool and subagents)
mode: thinking
prompt: who is Jane Roe
tools: []
confirm: none
budget:
  seconds: 90
checks:
- tool_called:
    name: research
- min_links:
    n: 2
mock:
  lead:
  - tool_calls:
    - name: web_search
      args:
        query: jane roe lead one
    - name: web_search
      args:
        query: jane roe lead two
    - name: web_search
      args:
        query: jane roe lead three
  - expect:
      tool: web_search
    tool_calls:
    - name: research
      args:
        description: Jane Roe
        brief: 'Goal: who is Jane Roe. Inputs: none. Constraints: public web. Done when: 2 sources. Return:
          a short profile with source URLs.'
  - expect:
      tool: research
    content: Jane Roe is an example person. [Profile](https://example.org/jane-roe) and [News](https://news.example.com/jane-roe).
  sub:
  - tool_calls:
    - name: web_search
      args:
        query: jane roe research 0
  - expect:
      tool: web_search
      not_contains: Not run
    tool_calls:
    - name: web_search
      args:
        query: jane roe research 1
  - expect:
      tool: web_search
      not_contains: Not run
    tool_calls:
    - name: web_search
      args:
        query: jane roe research 2
  - expect:
      tool: web_search
      not_contains: Not run
    tool_calls:
    - name: web_search
      args:
        query: jane roe research 3
  - expect:
      tool: web_search
      contains: search budget
    content: 'Jane Roe: [Profile](https://example.org/jane-roe), [News](https://news.example.com/jane-roe).'
