# Permission policy — DEFAULT classification rules (Feature 003, FR-007).
#
# THIS FILE SHIPS WITH THE PACKAGE. It lives here rather than under
# .omni-harness/ because that directory is runtime state and gitignored — a
# "shipped rule set" that is not in version control does not ship, which CI
# caught by failing every test that asserted against it.
#
# To customise: copy it somewhere writable and point `policy.rules_path` at
# your copy. Editing this file works but is overwritten on upgrade.
#
# THREE THINGS TO KNOW BEFORE EDITING:
#
# 1. A tool matching NO rule here is Tier 3. That is a decision, not a
#    fallback (FR-009): a newly connected tool source is dangerous until you
#    say otherwise, including tools that did not exist when this was written.
#
# 2. An exception may only RAISE a tier, never lower it (FR-037). Trying to
#    lower one FAILS THE LOAD, naming this file and line — deliberately, so you
#    find out. To make a call safer than its rule's default, change the rule.
#
# 3. If this file cannot be read, EVERY tool is Tier 3. A broken file makes the
#    assistant ask about everything; it never makes it act freely.
#
# Tier 1 = read, silent.  Tier 2 = reversible write, disclosed.
# Tier 3 = irreversible / outbound / spawning — stated, confirmed, then done.

policy:
  rules:
    # ---------------------------------------------------------------------
    # Feature 001 — coding-session watcher. Observe-only by construction:
    # the module offers no way to act on a session, so there is nothing here
    # that could be higher than Tier 1 (FR-010).
    # ---------------------------------------------------------------------
    - pattern: "list_coding_sessions"
      tier: 1
    - pattern: "get_session_status"
      tier: 1
    - pattern: "session-watcher_*"
      tier: 1

    # ---------------------------------------------------------------------
    # Feature 002 — trigger engine. Exposes no agent-callable tools; it
    # injects turns. Listed so the absence is deliberate rather than an
    # oversight, and so a tool added later does not silently inherit Tier 1.
    # ---------------------------------------------------------------------

    # ---------------------------------------------------------------------
    # Built-in tools
    # ---------------------------------------------------------------------
    - pattern: "ask_clarification"
      tier: 1
    - pattern: "view_image"
      tier: 1
    - pattern: "present_files"
      tier: 1
    - pattern: "tool_search"
      tier: 1

    # Local reads, listings and metadata. Added 2026-08-25 after enumerating
    # what the lead agent ACTUALLY has: 3 of 39 tools were classified, so
    # everything else fell to the FR-009 default of Tier 3 — including `ls`.
    #
    # A confirmation prompt for a directory listing is how a person learns to
    # approve without reading, which is the failure the tier model exists to
    # prevent. FR-009 was behaving correctly; the rules were not covering the
    # surface.
    #
    # EACH ONE IS NAMED. No `read*` or `*_list*` shortcut: a tool added later
    # must be classified deliberately rather than inherit Tier 1 from a glob
    # that happened to fit, which is the same reasoning as the comment above.
    - pattern: "ls"
      tier: 1
    - pattern: "glob"
      tier: 1
    - pattern: "grep"
      tier: 1
    - pattern: "read_file"
      tier: 1

    # Sandbox mutations, following filesystem_write* (Tier 2). A sandbox write
    # is more contained than one through the MCP server's allowed directories,
    # not less, so it does not warrant a higher tier than its equivalent.
    - pattern: "write_file"
      tier: 2
    - pattern: "str_replace"
      tier: 2

    # Outbound reads. Tier 1 because Article II tiers by CONSEQUENCE, not by
    # whether a packet leaves the machine: a search creates nothing, modifies
    # nothing and notifies nobody. Exfiltration is Article III's territory —
    # nothing read from a tool result may initiate an action — and tiering
    # searches does not help that while costing a confirmation on every lookup.
    - pattern: "web_search"
      tier: 1
    - pattern: "web_fetch"
      tier: 1
    - pattern: "image_search"
      tier: 1
    # Starts a preview server in the user's own sandbox — reversible (it can be
    # stopped) and worth mentioning, so Tier 2 rather than silent.
    - pattern: "preview"
      tier: 2
    # Spawns work. Article II names spawning as Tier 3 explicitly.
    - pattern: "task"
      tier: 3
    - pattern: "mcp_build"
      tier: 3

    # ---------------------------------------------------------------------
    # Filesystem — reads are silent, writes are disclosed, deletion is not
    # something to discover after the fact.
    # ---------------------------------------------------------------------
    - pattern: "filesystem_read*"
      tier: 1
    - pattern: "filesystem_list*"
      tier: 1
    # Listing and metadata, named individually for the same reason.
    - pattern: "filesystem_directory_tree"
      tier: 1
    - pattern: "filesystem_get_file_info"
      tier: 1
    - pattern: "filesystem_search_files"
      tier: 1
    # Mutations, matching filesystem_write* rather than the read rules above.
    - pattern: "filesystem_edit_file"
      tier: 2
    - pattern: "filesystem_create_directory"
      tier: 2
    - pattern: "filesystem_write*"
      tier: 2
    - pattern: "filesystem_move*"
      tier: 2
    - pattern: "filesystem_delete*"
      tier: 3

    # ---------------------------------------------------------------------
    # Email (FR-014). Read and draft only — the SEND capability is not
    # classified here because it is ABSENT from the tool surface entirely
    # (FR-012), removed in extensions_config.json. A capability that cannot be
    # reached is a stronger guarantee than one that is guarded, and a draft is
    # its own confirmation gate: nothing leaves until the user sends it.
    # ---------------------------------------------------------------------
    - pattern: "gmail_list*"
      tier: 1
    - pattern: "gmail_read*"
      tier: 1
    - pattern: "gmail_get*"
      tier: 1
    - pattern: "gmail_search*"
      tier: 1
    - pattern: "gmail_create_draft"
      tier: 2
    - pattern: "gmail_update_draft"
      tier: 2
    - pattern: "gmail_delete_draft"
      tier: 2

    # ---------------------------------------------------------------------
    # Calendar (FR-015).
    # ---------------------------------------------------------------------
    - pattern: "googlecalendar_list*"
      tier: 1
    - pattern: "googlecalendar_get*"
      tier: 1
    - pattern: "googlecalendar_find*"
      tier: 1
    - pattern: "googlecalendar_freebusy*"
      tier: 1
    # A tentative hold is reversible: the assistant created it and can remove
    # it. "Reversible" is assessed against what the assistant can itself undo.
    - pattern: "googlecalendar_create_event"
      tier: 2
      exceptions:
        # Inviting other people is outbound — it reaches someone else's inbox,
        # which the assistant cannot undo.
        - when: {send_updates: [all, externalOnly]}
          tier: 3
    - pattern: "googlecalendar_delete_event"
      tier: 3
    - pattern: "googlecalendar_update_event"
      tier: 3
    - pattern: "googlecalendar_decline*"
      tier: 3
    - pattern: "googlecalendar_respond*"
      tier: 3

    # ---------------------------------------------------------------------
    # GitHub — reads are silent. Same reasoning as the outbound reads above,
    # plus the destination is one the user already authorised with a token.
    # Writes are NOT covered here: they are unclassified on purpose, so they
    # remain Tier 3 by the FR-009 default until each is decided individually.
    # ---------------------------------------------------------------------
    - pattern: "github_get_file_contents"
      tier: 1
    - pattern: "github_get_issue"
      tier: 1
    - pattern: "github_get_pull_request"
      tier: 1
    - pattern: "github_get_pull_request_comments"
      tier: 1
    - pattern: "github_get_pull_request_files"
      tier: 1
    - pattern: "github_get_pull_request_reviews"
      tier: 1
    - pattern: "github_get_pull_request_status"
      tier: 1
    - pattern: "github_list_commits"
      tier: 1
    - pattern: "github_list_issues"
      tier: 1
    - pattern: "github_list_pull_requests"
      tier: 1
    - pattern: "github_search_code"
      tier: 1
    - pattern: "github_search_issues"
      tier: 1
    - pattern: "github_search_repositories"
      tier: 1
    - pattern: "github_search_users"
      tier: 1

    # GitHub writes. Decided individually rather than as a block, because
    # "writes to GitHub" spans a branch nobody sees and a merge nobody can undo.
    #
    # The dividing line is NOTIFICATION, not mutation: anything that reaches
    # another person cannot be unsent, which is what Article II means by
    # outbound. A comment is irreversible in the way that matters even though
    # GitHub will happily delete it afterwards.
    - pattern: "github_add_issue_comment"
      tier: 3
    - pattern: "github_create_pull_request_review"
      tier: 3
    - pattern: "github_create_issue"
      tier: 3
    # Your call, and irreversible in practice.
    - pattern: "github_merge_pull_request"
      tier: 3
    # Creates a namespace that may be public; deleting it is a separate
    # privileged act.
    - pattern: "github_create_repository"
      tier: 3
    - pattern: "github_fork_repository"
      tier: 3

    # Reversible, and notifies nobody.
    - pattern: "github_create_branch"
      tier: 2
    # Edits text already published under your name; history is retained and no
    # new person is reached.
    - pattern: "github_update_issue"
      tier: 2
    # Mechanical: brings the base into a PR branch.
    - pattern: "github_update_pull_request_branch"
      tier: 2

    # A push is reversible ON A BRANCH. Neither tool's NAME says which branch,
    # and a push to an unprotected main is not reversible in the sense that
    # matters — so the tier turns on the argument, like postgres_query.
    #
    # The predicate judges by name and cannot confirm a repository's real
    # default without a network call, which classification must never make. An
    # absent, empty, non-string or default-looking branch raises.
    - pattern: "github_push_files"
      tier: 2
      exceptions:
        - unless: {branch: branch_is_not_default}
          tier: 3
    - pattern: "github_create_or_update_file"
      tier: 2
      exceptions:
        - unless: {branch: branch_is_not_default}
          tier: 3

    # A DRAFT pull request notifies nobody and is reversible. A non-draft one
    # requests review from real people, which is the same
    # notification-is-the-irreversible-part rule applied to github_create_issue
    # above. Missing or non-boolean `draft` raises.
    - pattern: "github_create_pull_request"
      tier: 2
      exceptions:
        - unless: {draft: explicitly_true}
          tier: 3

    # ---------------------------------------------------------------------
    # postgres_query — the first tool whose NAME cannot classify it. SELECT and
    # DELETE FROM arrive through the same entry point.
    #
    # Tier 1 by default, RAISED to Tier 3 whenever the statement is not
    # established to be a single SELECT. The predicate answers "is this safe",
    # never "is this dangerous", so everything it cannot establish — an
    # unparseable statement, a missing `sql` argument, a second statement after
    # a semicolon, a WITH that might hide a DELETE — raises rather than falls
    # through.
    #
    # THE ARGUMENT NAME IS UNVERIFIED. The postgres MCP server needs a live
    # database to expose its schema, so `sql` is taken from the server's
    # documentation rather than measured. If it is wrong, the argument is absent
    # and the exception raises anyway — a wrong name here costs a confirmation
    # prompt, not a silent execution. Confirm it once a database is attached.
    # ---------------------------------------------------------------------
    - pattern: "postgres_query"
      tier: 1
      exceptions:
        - unless: {sql: read_only_sql}
          tier: 3

  confirmation:
    # 4 hours. THIS IS A STARTING GUESS, NOT A MEASURED VALUE — long enough to
    # survive a meeting, short enough that a forgotten action does not linger
    # for days. Labelled here, in the file you read, so it does not acquire
    # authority it has not earned.
    expires_after_seconds: 14400
