[project]
name = "omni-harness"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "omniharness-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.26",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.0.0",
    # Imported by production code, not only by tests: the gateway redacts every
    # channel message and every proactive one with session_watcher.redaction,
    # and the trigger engine schedules with croniter. Both sat in the dev group,
    # so a --no-dev install shipped a gateway that could not import them.
    "session-watcher",
    "croniter>=6.0.0",
    # Imported directly by app/ and previously installed only because other
    # packages pulled them in (tests/test_runtime_dependencies.py, T080):
    # mcp_secrets encrypts with cryptography, auth/config loads .env with
    # python-dotenv, the suggestions router builds langchain-core messages.
    "cryptography>=46.0.0",
    "python-dotenv>=1.2.0",
    "langchain-core>=1.3.0",
]

[project.optional-dependencies]
postgres = ["omniharness-harness[postgres]"]

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    # Pinned, not floating: `>=` lets a new ruff add rules and turn CI red
    # without a code change. Upgrading is a deliberate bump.
    "ruff==0.15.12",
    "vulture>=2.14",
    "mypy>=2.3.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
]

[tool.uv]
index-url = "https://pypi.org/simple"
# composio-core (every release through 0.7.22) caps Pillow <11, which holds
# Pillow on 10.4.0 and its critical advisories (Dependabot #215 #225 #240
# #261, fixed in 13.0.0). Nothing here imports composio at runtime: the
# gateway calls Composio's v3 REST API over httpx, and composio-core is kept
# only for its action list (tests/policy/github_connector_policy.py), which
# never touches PIL. Downgrading composio-core to 0.7.15 (no cap) would change
# that action list, so the cap is overridden instead. Drop this once
# composio-core allows Pillow >= 13.
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.workspace]
members = ["packages/harness", "packages/session_watcher"]

[tool.uv.sources]
omniharness-harness = { workspace = true }
session-watcher = { workspace = true }

[tool.mypy]
python_version = "3.12"
# Non-strict to start. The point is to make three features' worth of
# annotations into constraints rather than documentation; tightening comes
# after we have seen what that costs.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

# CI-BLOCKING only on what we wrote. Everything else inherits the permissive
# default above, so the checker is useful immediately rather than after a
# whole-codebase annotation project — which is how type checkers get added,
# never satisfied, and quietly disabled.
#
# A policy engine whose correctness rests on its types being what they claim is
# the strongest argument for this: `Tier` ordering, `PendingAction.targets`,
# and the confirm/decline verdicts are all load-bearing.
[[tool.mypy.overrides]]
module = ["app.policy.*", "app.trigger_engine.*", "session_watcher.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
